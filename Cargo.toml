[package]
name = "semantic-profiler"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Hybrid static AST and git churn/co-change semantic profiler with budget checking, longitudinal deltas, graph-edge exports, and CRW handoff packets"
license = "MIT"
readme = "README.md"
repository = "https://github.com/nestharus/semantic-profiler"
publish = false

[dependencies]
proc-macro2 = { version = "=1.0.106", features = ["span-locations"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
syn = { version = "=2.0.117", features = ["full", "visit"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
